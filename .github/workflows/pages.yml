name: Deploy Tank guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment package
        uses: actions/checkout@v4

      - name: Restore optimized static site
        run: |
          mkdir site
          cat deploy/site.tar.gz.part-* > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C site
          test -f site/index.html
          test -f site/heroes/anubarak.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Let the legacy branch-source build finish
        run: sleep 30

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

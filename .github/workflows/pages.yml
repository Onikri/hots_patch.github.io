name: Deploy complete Tank guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment package
        uses: actions/checkout@v4

      - name: Restore complete local site
        run: |
          mkdir site
          cat deploy/site.tar.gz.part-* > /tmp/site.tar.gz
          cd /tmp
          sha256sum -c "$GITHUB_WORKSPACE/deploy/site.tar.gz.sha256"
          tar -xzf site.tar.gz -C "$GITHUB_WORKSPACE/site"
          cd "$GITHUB_WORKSPACE"
          test -f site/index.html
          test -f site/heroes/anubarak.html
          test -d site/asset-library/assets
          test -f site/asset-library/embeds/heroes/anubarak.html

      - name: Verify local HTML and asset links
        run: node scripts/check-static-links.mjs site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Let the legacy branch-source build finish
        run: sleep 30

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
